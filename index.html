<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="La carte des pays que vous avez visités." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mes pays" />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a20" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Mes pays</title>
  </head>
  <body>
    <main id="app">
      <svg id="map" role="img" aria-label="Carte du monde"></svg>

      <header class="top">
        <div class="stats" aria-live="polite">
          <span id="count" class="count">0</span>
          <span class="stats-text">
            <span id="count-label" class="count-label">pays visité</span>
            <span id="land" class="land"></span>
          </span>
        </div>
        <button id="btn-list" class="chip" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
          Ma liste
        </button>
      </header>

      <p id="hint" class="hint">Touchez un pays pour l'ajouter</p>

      <button id="btn-reset" class="fab" type="button" aria-label="Voir le monde entier">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z" />
        </svg>
      </button>

      <div id="bottom" class="bottom">
        <div id="toast" class="toast" role="status" hidden>
          <span id="toast-text"></span>
          <button id="toast-undo" type="button">Annuler</button>
        </div>
        <ul id="results" class="results" role="listbox" aria-label="Pays trouvés" hidden></ul>
        <form id="search-form" class="searchbar" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4 4" /></svg>
          <input
            id="search"
            type="search"
            placeholder="Ajouter un pays…"
            aria-label="Chercher un pays à ajouter"
            enterkeyhint="done"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button id="search-clear" class="clear" type="button" aria-label="Effacer" hidden>✕</button>
        </form>
      </div>

      <div id="sheet-backdrop" class="backdrop" hidden></div>
      <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
        <div class="grabber" aria-hidden="true"></div>
        <header class="sheet-head">
          <h2 id="sheet-title">Mes pays</h2>
          <button id="btn-share" class="link" type="button">Partager</button>
          <button id="btn-close" class="link strong" type="button">OK</button>
        </header>
        <ul id="visited-list" class="visited-list"></ul>
        <p id="empty" class="empty">Aucun pays pour l'instant.<br />Touchez la carte ou cherchez un pays en bas.</p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
